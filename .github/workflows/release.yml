name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      prerelease:
        description: Prerelease channel
        required: true
        default: none
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
      npm_tag:
        description: npm dist-tag (auto selects latest or the prerelease channel)
        required: true
        default: auto
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      npm_tag: ${{ steps.validate.outputs.npm_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release branch and npm tag
        id: validate
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "Release must run from a branch."
            exit 1
          fi
          if [ "$PRERELEASE" = none ] && [ "$GITHUB_REF_NAME" != main ]; then
            echo "Stable releases must run from main."
            exit 1
          fi
          if [ "$NPM_TAG" = auto ]; then
            if [ "$PRERELEASE" = none ]; then
              NPM_TAG=latest
            else
              NPM_TAG="$PRERELEASE"
            fi
          fi
          if [[ ! "$NPM_TAG" =~ ^[a-z][a-z0-9._-]*$ ]]; then
            echo "Invalid npm dist-tag: $NPM_TAG"
            exit 1
          fi
          if [ "$PRERELEASE" != none ] && [ "$NPM_TAG" = latest ]; then
            echo "Prereleases cannot be published to latest."
            exit 1
          fi
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release checks
        run: |
          yarn lint
          yarn typecheck
          yarn test
          yarn test:d
          yarn test:package

      - name: Create release commit and tag
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release }}
          PRERELEASE: ${{ inputs.prerelease }}
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          PREVIOUS_VERSION=$(node -p "require('./package.json').version")
          CMD=(yarn release)
          if [ "$RELEASE_TYPE" != auto ]; then
            CMD+=(--release-as "$RELEASE_TYPE")
          fi
          if [ "$PRERELEASE" != none ]; then
            CMD+=(--prerelease "$PRERELEASE")
          fi
          "${CMD[@]}"

          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "No new release was created."
            exit 1
          fi
          TAG="v$VERSION"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        run: git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/${{ steps.version.outputs.tag }}"

  publish:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Verify npm supports trusted publishing
        run: |
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)" "$(npm --version)"

      - name: Check released package
        run: |
          yarn lint
          yarn typecheck
          yarn test
          yarn test:d
          yarn test:package

      - name: Check published version
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npm view "$NAME" versions --json > "$RUNNER_TEMP/published-versions.json"
          PUBLISHED=$(node -e "const fs = require('node:fs'); const versions = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log([].concat(versions).includes(process.argv[2]))" "$RUNNER_TEMP/published-versions.json" "$VERSION")
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with trusted publishing
        if: steps.published.outputs.published == 'false'
        env:
          NPM_TAG: ${{ needs.release.outputs.npm_tag }}
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --access public --tag "$NPM_TAG"

  github-release:
    needs: [release, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          CMD=(gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" != none ]; then
            CMD+=(--prerelease --latest=false)
          fi
          "${CMD[@]}"
