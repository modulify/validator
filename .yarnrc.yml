enableGlobalCache: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.12.0.cjs

# The TypeScript config loader needs peers forwarded through @commitlint/load.
packageExtensions:
  "@commitlint/load@21.2.3":
    peerDependencies:
      "@types/node": "*"
      typescript: ">=5"
  "@commitlint/cli@21.2.3":
    peerDependencies:
      "@types/node": "*"
      typescript: ">=5"
